name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd .github/actions/codeartifact-auth
          npm ci

      - name: Run lint
        run: |
          cd .github/actions/codeartifact-auth
          npm run lint

      - name: Run tests
        run: |
          cd .github/actions/codeartifact-auth
          npm test

      - name: Build
        run: |
          cd .github/actions/codeartifact-auth
          npm run build
