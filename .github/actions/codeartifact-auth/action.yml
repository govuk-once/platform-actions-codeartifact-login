name: 'CodeArtifact Authentication'
description: 'Authenticate with AWS CodeArtifact using GitHub OIDC token'
inputs:
  package-manager:
    description: 'Package manager to configure (npm or pnpm)'
    required: false
    default: 'pnpm'
  codeartifact-domain:
    description: 'CodeArtifact domain name'
    required: false
    default: 'registry-prod'
  codeartifact-repository:
    description: 'CodeArtifact repo name'
    required: false
    default: 'registry-prod-repo'
  codeartifact-domain-owner:
    description: 'AWS account ID that owns the CodeArtifact domain'
    required: false
    default: 904690835784
  aws-region:
    description: 'AWS region for CodeArtifact operations'
    required: false
    default: 'eu-west-2'
  role-to-assume:
    description: 'IAM role ARN to assume for OIDC authentication'
    required: true
outputs:
  registry-url:
    description: 'CodeArtifact registry URL'
  auth-token:
    description: 'CodeArtifact authorization token'
runs:
  using: 'node20'
  main: 'dist/index.js'
